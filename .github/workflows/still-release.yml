name: Publish Still release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag (for example v0.2.2)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: still-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run desktop -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Still-Windows-EXE
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HAS_KEY: ${{ secrets.STILL_ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13846066'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run android:init -- --ci
      - name: Restore optional persistent development signing key
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          STILL_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.STILL_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$STILL_ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
      - run: npm run android:build -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Still-Android-APK
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    needs: [verify, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Still-Windows-EXE
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: Still-Android-APK
          path: release-assets/android
      - name: Create GitHub prerelease with verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || (github.ref_name == 'main' && 'v0.3.1' || github.ref_name) }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f \( -name '*.apk' -o -name '*.exe' \) -print0)
          if [ "${#files[@]}" -lt 2 ]; then echo "Missing APK or EXE"; exit 1; fi
          gh release create "$RELEASE_TAG" "${files[@]}" --target "$GITHUB_SHA" --prerelease --title "Still $RELEASE_TAG (experimental)" --notes "Still v0.3.1: faster task capture, smart dates, labels, list and board views, and section rename/delete. Experimental builds. Android uses development signing unless a persistent key is configured; Windows installer is unsigned. Back up your workspace before updating."
