name: Still verified builds
on:
  push:
    branches: [feat/hamsterbase-still-rebuild]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: still-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: npm test
      - run: npm run web:build
      - run: npm run electron:build
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: Still-web
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Still-screenshots-and-verification
          path: |
            screenshots/still-*.png
            verification/ui-results.json
  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run web:build -- --use-relative-base
      - run: npm run electron:build
      - run: npm run electron:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Missing NSIS installer' }
          Get-FileHash $installer.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Still-Windows-x64-installer
          path: release/*.exe
          if-no-files-found: error
  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: Still-web
          path: dist
      - run: pnpm exec cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleStandardDebug --no-daemon
      - name: Verify APK signature and application identity
        run: |
          APK=$(find android/app/build/outputs/apk/standard/debug -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-manifest.txt
          grep "package: name='app.still.next'" apk-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Still-Android-testing-APK
          path: android/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
