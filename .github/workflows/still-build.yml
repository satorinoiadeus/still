name: Still verified builds
on:
  push:
    branches: [feat/hamsterbase-still-rebuild]
    paths-ignore: ['**.md', 'screenshots/**', 'verification/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: still-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: npm test
      - run: npm run web:build
      - run: npm run electron:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: Still-web
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Still-screenshots-and-verification
          path: |
            screenshots/still-*.png
            verification/ui-results.json
  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run web:build -- --use-relative-base
      - run: npm run electron:build
      - run: npm run electron:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Missing NSIS installer' }
          Get-FileHash $installer.FullName -Algorithm SHA256
      - name: Install and exercise the Windows application
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*.exe | Select-Object -First 1
          $installDir = Join-Path $env:LOCALAPPDATA 'Still-Rebuild-Smoke'
          $process = Start-Process $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS exited $($process.ExitCode)" }
          $exe = Join-Path $installDir 'Still.exe'
          if (-not (Test-Path $exe)) { throw "Installed application missing: $exe" }
          node tests/windows.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Still-Windows-runtime-verification
          path: verification/windows-*
      - uses: actions/upload-artifact@v4
        with:
          name: Still-Windows-x64-installer
          path: release/*.exe
          if-no-files-found: error
  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: Still-web
          path: dist
      - name: Restore development signing key for compatible testing updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: still-testing-signing-v1
      - run: pnpm exec cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleStandardDebug --no-daemon
      - name: Verify APK signature and application identity
        run: |
          APK=$(find android/app/build/outputs/apk/standard/debug -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-manifest.txt
          grep "package: name='app.still.next'" apk-manifest.txt
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Still-Android-runtime-verification
          path: verification/android-*
      - uses: actions/upload-artifact@v4
        with:
          name: Still-Android-testing-APK
          path: android/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/hamsterbase-still-rebuild'
    needs: [web, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish verified version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="still-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already published; preserving its original tested assets."
            exit 0
          fi
          mkdir -p release
          cp artifacts/Still-Android-testing-APK/*.apk "release/Still-$VERSION-Android.apk"
          cp artifacts/Still-Windows-x64-installer/*.exe "release/Still-$VERSION-Windows-x64.exe"
          (cd artifacts/Still-web && zip -qr "../../release/Still-$VERSION-web.zip" .)
          (cd artifacts && zip -qr "../release/Still-$VERSION-verification.zip" Still-screenshots-and-verification Still-Windows-runtime-verification Still-Android-runtime-verification)
          (cd release && sha256sum Still-* > SHA256SUMS.txt)
          printf 'Verified source commit: %s\n\n' "$GITHUB_SHA" > release/notes.md
          cat RELEASE-1.1.md >> release/notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Still $VERSION" --notes-file release/notes.md release/*-Android.apk release/*-Windows-x64.exe release/*-web.zip release/*-verification.zip release/SHA256SUMS.txt
