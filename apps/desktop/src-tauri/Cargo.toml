[package]
name = "still-tasks"
version = "0.3.0"
description = "A little space for your next action"
authors = ["Still", "DongDong (upstream foundations)"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"
[lib]
name = "still_tasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde_json = "1"
tauri-plugin-fs = "2"

[profile.dev]
debug = 0
incremental = false
codegen-units = 1
